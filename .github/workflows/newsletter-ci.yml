name: Newsletter CI

on:
  push:
    branches:
      - feat/newsletter-turnstile-source-tag

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: armenian-keyboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint newsletter files
        run: npx eslint src/newsletter.test.ts src/lib/newsletter-spam.ts src/lib/newsletter-turnstile.ts src/lib/newsletter-mailchimp.ts src/app/api/newsletter/route.ts src/components/FooterNewsletterForm.tsx src/components/Footer.tsx

      - name: Source verification
        run: npm run verify:source

      - name: Build
        run: npm run build

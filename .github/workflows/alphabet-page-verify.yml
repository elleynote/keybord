name: Armenian alphabet page verification

on:
  push:
    branches:
      - feature/armenian-alphabet-page

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: armenian-keyboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Confirm npm
        run: npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Lint alphabet page files
        run: npx eslint src/app/armenian-alphabet src/armenian-alphabet-page.test.tsx

      - name: Run source verification
        run: npm run verify:source

      - name: Run production build
        run: npm run build
